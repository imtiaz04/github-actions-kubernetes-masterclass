name: Terraform Provision Fixed
on:
  workflow_dispatch:
jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix HashiCorp GPG key
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | \
          sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
          https://apt.releases.hashicorp.com $(lsb_release -cs) main" | \
          sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y terraform

      - name: Terraform Init
        working-directory: terraform
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Store Secrets to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          EC2_IP=$(cd terraform && terraform output -raw ec2_public_ip)
          echo "EC2_IP=$EC2_IP" >> $GITHUB_ENV
          echo "$EC2_IP" | gh secret set EC2_HOST --repo ${{ github.repository }}
          cd terraform && terraform output -raw private_key | \
          gh secret set EC2_SSH_KEY --repo ${{ github.repository }}
          echo "✅ Secrets stored!"

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          cd terraform && terraform output -raw private_key > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Wait for SSH to be ready
        run: |
          echo "Waiting for EC2 SSH..."
          for i in {1..30}; do
            if ssh -i ~/.ssh/ec2_key.pem \
                   -o StrictHostKeyChecking=no \
                   -o ConnectTimeout=5 \
                   ubuntu@${{ env.EC2_IP }} "echo ready" 2>/dev/null; then
              echo "✅ SSH is ready!"
              break
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 10
          done

      - name: Deploy App on EC2
        # FIX: pass DOCKERHUB_USERNAME as an SSH environment variable using -o SendEnv
        # and AcceptEnv on the remote side — or simpler: embed it directly in the command.
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
              -o StrictHostKeyChecking=no \
              ubuntu@${{ env.EC2_IP }} \
              DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}" \
              bash << 'ENDSSH'
          for i in {1..20}; do
            if [ -f /tmp/docker-ready ]; then
              echo "✅ Docker is ready!"
              break
            fi
            echo "Waiting for Docker... $i/20"
            sleep 15
          done
          if [ ! -d ~/skillpulse ]; then
            git clone https://github.com/imtiaz04/github-actions-kubernetes-masterclass ~/skillpulse
          fi
          cd ~/skillpulse
          git pull origin main
          cat > .env << EOF
          DOCKERHUB_USERNAME=imtiaz04
          MYSQL_ROOT_PASSWORD=skillpulse123
          MYSQL_DATABASE=skillpulse
          DB_HOST=db
          DB_PORT=3306
          DB_USER=root
          DB_PASSWORD=skillpulse123
          DB_NAME=skillpulse
          EOF
          newgrp docker << DOCKERCMD
          docker compose pull
          docker compose up -d
          docker image prune -f
          DOCKERCMD
          echo "✅ App deployed!"
          ENDSSH
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
