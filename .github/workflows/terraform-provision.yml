name: Terraform Provision

on:
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fix HashiCorp GPG key
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | \
          sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
          https://apt.releases.hashicorp.com $(lsb_release -cs) main" | \
          sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y terraform

      - name: Terraform Init
        working-directory: terraform
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Get EC2 IP and Private Key
        working-directory: terraform
        run: |
          echo "EC2_IP=$(terraform output -raw ec2_public_ip)" >> $GITHUB_ENV
          echo "PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          terraform output -raw private_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Wait for EC2 to be ready
        run: |
          echo "Waiting for EC2 to boot and install Docker..."
          sleep 120

      - name: Deploy App on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.EC2_IP }}
          username: ubuntu
          key: ${{ env.PRIVATE_KEY }}
          script: |
            # Wait for Docker to be ready
            for i in {1..10}; do
              if command -v docker &> /dev/null; then
                echo "Docker is ready!"
                break
              fi
              echo "Waiting for Docker... attempt $i"
              sleep 15
            done

            if [ ! -d ~/skillpulse ]; then
              git clone https://github.com/${{ github.repository }} ~/skillpulse
            fi
            cd ~/skillpulse
            git pull origin main
            cat > .env << EOF
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            MYSQL_ROOT_PASSWORD=skillpulse123
            MYSQL_DATABASE=skillpulse
            DB_HOST=db
            DB_PORT=3306
            DB_USER=root
            DB_PASSWORD=skillpulse123
            DB_NAME=skillpulse
            EOF
            docker compose pull
            docker compose up -d
            docker image prune -f
            echo "✅ App deployed at http://${{ env.EC2_IP }}"