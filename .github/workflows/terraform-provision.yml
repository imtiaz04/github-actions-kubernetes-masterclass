name: Terraform Provision

on:
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fix HashiCorp GPG key
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | \
          sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
          https://apt.releases.hashicorp.com $(lsb_release -cs) main" | \
          sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y terraform

      - name: Terraform Init
        working-directory: terraform
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Store Secrets to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          EC2_IP=$(cd terraform && terraform output -raw ec2_public_ip)
          PRIVATE_KEY=$(cd terraform && terraform output -raw private_key)
          echo "EC2_IP=$EC2_IP" >> $GITHUB_ENV
          echo "PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          echo "$PRIVATE_KEY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          # Also store in GitHub secrets for future runs
          echo "$EC2_IP" | gh secret set EC2_HOST --repo ${{ github.repository }}
          echo "$PRIVATE_KEY" | gh secret set EC2_SSH_KEY --repo ${{ github.repository }}
          echo "✅ Secrets stored!"

      - name: Deploy App on EC2
        run: |
          # Write key to temp file
          echo "${{ env.PRIVATE_KEY }}" > /tmp/ec2_key.pem
          chmod 600 /tmp/ec2_key.pem

          # Deploy via SSH
          ssh -i /tmp/ec2_key.pem \
              -o StrictHostKeyChecking=no \
              ubuntu@${{ env.EC2_IP }} << 'ENDSSH'
            # Wait for Docker
            for i in {1..20}; do
              if [ -f /tmp/docker-ready ]; then
                echo "✅ Docker is ready!"
                break
              fi
              echo "Waiting for Docker... attempt $i/20"
              sleep 15
            done

            if ! command -v docker &> /dev/null; then
              echo "❌ Docker not found"
              exit 1
            fi

            if [ ! -d ~/skillpulse ]; then
              git clone https://github.com/imtiaz04/github-actions-kubernetes-masterclass ~/skillpulse
            fi
            cd ~/skillpulse
            git pull origin main
            cat > .env << EOF
            DOCKERHUB_USERNAME=imtiaz42
            MYSQL_ROOT_PASSWORD=skillpulse123
            MYSQL_DATABASE=skillpulse
            DB_HOST=db
            DB_PORT=3306
            DB_USER=root
            DB_PASSWORD=skillpulse123
            DB_NAME=skillpulse
            EOF
                        docker compose pull
                        docker compose up -d
                        docker image prune -f
                        echo "✅ App deployed!"
                    ENDSSH

                    # Cleanup key
                    rm /tmp/ec2_key.pem